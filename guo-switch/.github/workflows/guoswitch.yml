name: Build Guo Switch development snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check providers and history
        run: python3 scripts/check_guo.py
  switch:
    needs: core
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20251117
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build native NRO
        run: bash scripts/build_guoswitch.sh --prepare
      - uses: actions/upload-artifact@v4
        with:
          name: guoswitch-development-snapshot
          path: dist/switch/guoswitch/guoswitch.nro
          if-no-files-found: error
